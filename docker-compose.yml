# Production-like stack: Orqevio + PostgreSQL.
#   cp .env.example .env   # set APP_URL and a strong POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orqevio
      POSTGRES_USER: orqevio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U orqevio -d orqevio']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://orqevio:${POSTGRES_PASSWORD}@db:5432/orqevio
      APP_URL: ${APP_URL:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      SETUP_CODE: ${SETUP_CODE:-}
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - app-data:/data

volumes:
  db-data:
  app-data:

# A reverse proxy that asks for a password (HTTP basic auth), in front of an Orqevio container
# named "orqevio", as the CI runs it. Agents bring their own Authorization header, with a token
# Orqevio checks itself: requests carrying one go through without the password, and so do /mcp
# and the addresses OAuth clients read before they have a token, as the README recommends.
map $http_authorization $proxy_password {
  ~*^Bearer\s off;
  default "Orqevio";
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  client_max_body_size 25m;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  location / {
    auth_basic $proxy_password;
    auth_basic_user_file /etc/nginx/htpasswd;
    proxy_pass http://orqevio:3000;
  }

  location ~ ^/(mcp$|oauth/(register|token|revoke)$|\.well-known/) {
    proxy_pass http://orqevio:3000;
  }
}

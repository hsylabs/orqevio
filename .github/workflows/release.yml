name: Release

# Publishes a version when its tag (v1.2.3) is pushed: the npm packages
# (orqevio, create-orqevio), the Docker image (ghcr.io/<owner>/orqevio) and the
# GitHub release with the notes from CHANGELOG.md. See RELEASING.md.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        name: Read the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Only release what is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tag is not on main."; exit 1; }
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check that every package carries the version and that it has notes
        run: node scripts/release/check-version.mjs "${{ steps.version.outputs.version }}" --notes release-notes.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:cloudflare
      - name: Pack the npm packages
        run: |
          mkdir -p packs
          for package in orqevio create-orqevio; do (cd "packages/$package" && pnpm pack --pack-destination "$GITHUB_WORKSPACE/packs"); done
      # Runs the npm job's publish commands without publishing, so a mistake shows up
      # here, before anyone is asked to approve the release.
      - name: Try the npm publish (dry run)
        env:
          TAG: ${{ steps.version.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          npx --yes npm@11 publish ./packs/orqevio-*.tgz --access public --tag "$TAG" --dry-run
          npx --yes npm@11 publish ./packs/create-orqevio-*.tgz --access public --tag "$TAG" --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            packs/*.tgz
            release-notes.md
          if-no-files-found: error

  npm:
    name: Publish to npm
    # After the Docker image: copies learn about a version from create-orqevio,
    # published last, so the notice never offers an image that is not out yet.
    needs: [verify, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Add protection rules (required reviewers) to this environment in the repository settings.
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing; npm adds the provenance attestation
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing (11.5.1 or later)
        run: npm install --global npm@11
      - uses: actions/download-artifact@v8
        with:
          name: release
      # Trusted publishing: npm signs in with this job's OIDC token (no npm token at all)
      # and adds the provenance attestation on its own; --provenance only makes it explicit.
      # Both packages need a trusted publisher on npmjs.com for release.yml and this environment.
      - name: Publish orqevio, then create-orqevio (which depends on it)
        env:
          TAG: ${{ needs.verify.outputs.prerelease == 'true' && 'next' || 'latest' }}
        # The ./ makes npm read a file: "packs/name.tgz" alone is a GitHub "user/repo" to npm.
        run: |
          npm publish ./packs/orqevio-*.tgz --access public --tag "$TAG" --provenance
          npm publish ./packs/create-orqevio-*.tgz --access public --tag "$TAG" --provenance

  # Each platform is built on a machine of its own architecture: emulating arm64 with QEMU
  # was slow and once crashed mid-build, leaving the job hanging until its timeout. Each
  # build pushes its image by digest only; the docker job below tags them as one image.
  docker-build:
    name: Build the Docker image (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    # A build takes about 4 minutes: a hang fails here instead of an hour later.
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          # GitHub has no "latest" label for its Arm runners.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same tags as the docker job, for the version label; the tags themselves go on there.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=Orqevio
            org.opencontainers.image.licenses=FSL-1.1-ALv2
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/${{ github.repository }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
      - name: Keep the digest for the docker job
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish the Docker image
    needs: [verify, docker-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease != 'true' }}
      # One image for both platforms, under the version's tags; the attestations
      # (provenance and SBOM) of each build come along.
      - name: Tag both platforms as one image
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
      - name: Check that the image has both platforms
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "$IMAGE"
          for platform in linux/amd64 linux/arm64; do
            docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' | jq -e --arg p "$platform" '[.manifests[] | select(.platform.os + "/" + .platform.architecture == $p)] | length == 1' > /dev/null || { echo "Missing $platform"; exit 1; }
          done

  release:
    name: Publish the GitHub release
    # Last, so a release (and the in-app update notice) never points at packages that are not out yet.
    needs: [verify, npm, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - name: Create the release with the notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "Orqevio $VERSION" --notes-file release-notes.md "${flags[@]}"

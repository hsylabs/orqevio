name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      # A fresh SQLite copy in a temporary folder; the setup test claims it with this code.
      DATA_DIR: ${{ github.workspace }}/.e2e-data
      SETUP_CODE: e2e-setup-code-1234
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @orqevio/web exec playwright install --with-deps chromium
      - name: Start the production server
        run: |
          nohup pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  e2e-cloudflare:
    name: End-to-end tests (Cloudflare runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The same suite against the Worker + Durable Object + R2 runtime, run
      # locally by Wrangler (workerd): no Cloudflare account is involved.
      E2E_BASE_URL: http://127.0.0.1:8787
      SETUP_CODE: e2e-setup-code-1234
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check the Worker bundle
        run: pnpm --filter @orqevio/server check:worker
      - name: Install Chromium for Playwright
        run: pnpm --filter @orqevio/web exec playwright install --with-deps chromium
      - name: Start the Worker locally
        working-directory: apps/server
        run: |
          nohup pnpm exec wrangler dev --local --port 8787 --ip 127.0.0.1 --var "SETUP_CODE:$SETUP_CODE" > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then
              echo "Worker is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Worker did not become ready in 90 seconds"
          cat "$RUNNER_TEMP/worker.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"

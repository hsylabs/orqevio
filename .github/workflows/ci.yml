name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orqevio
          POSTGRES_PASSWORD: orqevio
          POSTGRES_DB: orqevio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqevio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://orqevio:orqevio@localhost:5432/orqevio_test
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orqevio
          POSTGRES_PASSWORD: orqevio
          POSTGRES_DB: orqevio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orqevio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://orqevio:orqevio@localhost:5432/orqevio_e2e
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Install Chromium for Playwright
        run: pnpm --filter @orqevio/web exec playwright install --with-deps chromium
      - name: Start the production server
        run: |
          nohup pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"

name: CI

# Two levels, to spend runner minutes where they matter:
# - Light, on every pull request and on pushes to develop and main: typecheck, unit and
#   integration tests and the build, on one runner for about two minutes.
# - Heavy, on a pull request into main (the version about to be released) and when started
#   by hand on any branch (Actions → CI → Run workflow): the end-to-end suite in Chromium,
#   Firefox and WebKit, against the Cloudflare package and against the Docker images. An open
#   pull request whose base changes to main gets them too: ci-retarget.yml starts this
#   workflow on its branch.
# Elsewhere the heavy jobs are skipped, which costs nothing and counts as passed for a
# required check. Each runs as its own job, without a matrix, so that a skipped one still
# reports under its own name.
#
# The end-to-end jobs run inside Playwright's own image, which already has its browsers and
# the system packages they need: installing those from Ubuntu's package mirror once took more
# than the job's time. The image goes with @playwright/test's version, as the browsers in it
# are the ones that version drives; apps/web/test/ci-playwright.test.ts checks that they match.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json ("packageManager").
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end tests
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user, who owns the checkout; Chromium needs the host's shared memory.
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      # The setup test claims a fresh copy with this code.
      SETUP_CODE: e2e-setup-code-1234
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Without the packages' own build steps: better-sqlite3 brings its binary built for
      # each platform, but pnpm would still run its node-gyp build, which needs make even when
      # it builds nothing, and the image has no make; esbuild and workerd find their binaries
      # in packages of their own.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # A fresh SQLite copy in a folder of the checkout. Inside the container the checkout is
      # at $GITHUB_WORKSPACE; `github.workspace` would name the runner's own path to it.
      - name: Start the production server
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/.e2e-data" nohup pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      # Playwright's page snapshot and diagnostics of every failed test.
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-chromium
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The same suite in Firefox and in Safari's engine (WebKit), each against a fresh copy.
  e2e-firefox:
    name: End-to-end tests (firefox)
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user, who owns the checkout.
      options: --user 1001
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      SETUP_CODE: e2e-setup-code-1234
      E2E_BROWSER: firefox
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Without the packages' own build steps: better-sqlite3 brings its binary built for
      # each platform, but pnpm would still run its node-gyp build, which needs make even when
      # it builds nothing, and the image has no make; esbuild and workerd find their binaries
      # in packages of their own.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # A fresh SQLite copy in a folder of the checkout. Inside the container the checkout is
      # at $GITHUB_WORKSPACE; `github.workspace` would name the runner's own path to it.
      - name: Start the production server
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/.e2e-data" nohup pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-firefox
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-webkit:
    name: End-to-end tests (webkit)
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user, who owns the checkout.
      options: --user 1001
    # WebKit is the slowest engine: with the same code its tests have taken from 12 to 18
    # minutes, and the job about a minute more.
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      SETUP_CODE: e2e-setup-code-1234
      E2E_BROWSER: webkit
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Without the packages' own build steps: better-sqlite3 brings its binary built for
      # each platform, but pnpm would still run its node-gyp build, which needs make even when
      # it builds nothing, and the image has no make; esbuild and workerd find their binaries
      # in packages of their own.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      # A fresh SQLite copy in a folder of the checkout. Inside the container the checkout is
      # at $GITHUB_WORKSPACE; `github.workspace` would name the runner's own path to it.
      - name: Start the production server
        run: |
          DATA_DIR="$GITHUB_WORKSPACE/.e2e-data" nohup pnpm start > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in 60 seconds"
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-webkit
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-cloudflare:
    name: End-to-end tests (Cloudflare package)
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # The runner's own user, who owns the checkout; Chromium needs the host's shared memory.
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    env:
      # The same suite against what `npx create-orqevio` deploys: the packaged
      # Worker, web app and configuration of a copy, run locally by Wrangler
      # (workerd). No Cloudflare account is involved.
      E2E_BASE_URL: http://127.0.0.1:8787
      SETUP_CODE: e2e-setup-code-1234
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Without the packages' own build steps: better-sqlite3 brings its binary built for
      # each platform, but pnpm would still run its node-gyp build, which needs make even when
      # it builds nothing, and the image has no make; esbuild and workerd find their binaries
      # in packages of their own.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:cloudflare
      - name: Generate the configuration of a copy and check its deploy bundle
        run: |
          node packages/create-orqevio/dist/cli.js config --name ci-copy > "$RUNNER_TEMP/wrangler.json"
          pnpm --filter create-orqevio exec wrangler deploy --dry-run --config "$RUNNER_TEMP/wrangler.json" --outdir "$RUNNER_TEMP/bundle"
      - name: Check the Deploy to Cloudflare template with the packed packages
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for package in orqevio create-orqevio; do (cd "packages/$package" && pnpm pack --pack-destination "$RUNNER_TEMP/packs"); done
          cp -r templates/cloudflare "$RUNNER_TEMP/template"
          cd "$RUNNER_TEMP/template"
          npm install --no-audit --no-fund "$RUNNER_TEMP"/packs/orqevio-*.tgz "$RUNNER_TEMP"/packs/create-orqevio-*.tgz
          npm run deploy -- --dry-run
      - name: Start the copy locally
        run: |
          nohup pnpm --filter create-orqevio exec wrangler dev --config "$RUNNER_TEMP/wrangler.json" --local --port 8787 --ip 127.0.0.1 --var "SETUP_CODE:$SETUP_CODE" > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/healthz > /dev/null; then
              echo "Worker is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Worker did not become ready in 90 seconds"
          cat "$RUNNER_TEMP/worker.log"
          exit 1
      - run: pnpm test:e2e
      - name: Show Worker log
        if: failure()
        run: cat "$RUNNER_TEMP/worker.log"
      # Playwright's page snapshot and diagnostics of every failed test.
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-cloudflare
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The image that releases publish, built natively on each architecture as release.yml
  # does, and started: a Dockerfile that no longer builds shows up here, not on release day.
  # On amd64 the whole end-to-end suite then runs against it, as people install it.
  docker-amd64:
    name: Docker image (linux/amd64)
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      SETUP_CODE: e2e-setup-code-1234
      # Only for the throwaway proxy below.
      PROXY_PASSWORD: proxy-e2e-password
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: orqevio:ci
      - name: Start the image and check that it answers
        run: |
          docker run -d --name orqevio -p 3000:3000 -e SETUP_CODE -e APP_URL orqevio:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs orqevio
          exit 1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # This job builds and runs Docker images, so it runs on the runner itself, not in
      # Playwright's image: Chromium and its system packages are installed here, from the
      # package mirror. A minute is usual; a slow mirror fails here in 10 minutes instead of
      # using up the job's time.
      - name: Install Chromium for Playwright
        timeout-minutes: 10
        run: pnpm --filter @orqevio/web exec playwright install --with-deps chromium
      - name: Run the end-to-end tests against the image
        run: pnpm test:e2e
      # The same image, fresh, behind a reverse proxy that asks for a password, as many put it.
      - name: Start a fresh copy behind a proxy that asks for a password
        run: |
          docker network create proxied
          docker run -d --name orqevio-proxied --network proxied --network-alias orqevio \
            -e SETUP_CODE -e APP_URL=http://localhost:8080 -e TRUST_PROXY=true orqevio:ci
          printf 'orqevio:{PLAIN}%s\n' "$PROXY_PASSWORD" > "$RUNNER_TEMP/htpasswd"
          docker run -d --name proxy --network proxied -p 8080:8080 \
            -v "$PWD/apps/web/e2e/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$RUNNER_TEMP/htpasswd:/etc/nginx/htpasswd:ro" nginx:1.27-alpine
          for _ in $(seq 1 30); do
            if curl -fsS -u "orqevio:$PROXY_PASSWORD" http://127.0.0.1:8080/healthz; then
              # Without the password, the proxy keeps the copy to itself.
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/auth/session)" = 401
              exit
            fi
            sleep 1
          done
          docker logs orqevio-proxied
          docker logs proxy
          exit 1
      - name: Run the end-to-end tests through the proxy
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_BASIC_AUTH: orqevio:${{ env.PROXY_PASSWORD }}
        run: pnpm test:e2e
      - name: Show the container log
        if: failure()
        run: |
          docker logs orqevio
          docker logs orqevio-proxied || true
          docker logs proxy || true
      - name: Keep the results of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results-docker
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  docker-arm64:
    name: Docker image (linux/arm64)
    if: github.base_ref == 'main' || github.event_name == 'workflow_dispatch'
    # GitHub has no "latest" label for its Arm runners.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      APP_URL: http://localhost:3000
      SETUP_CODE: e2e-setup-code-1234
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: orqevio:ci
      - name: Start the image and check that it answers
        run: |
          docker run -d --name orqevio -p 3000:3000 -e SETUP_CODE -e APP_URL orqevio:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs orqevio
          exit 1
